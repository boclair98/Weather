spring:
  config:
    import: optional:classpath:application-local.yml

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-shedlock.sql

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/weatherdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

weather:
  api:
    key: ${WEATHER_API_KEY:}
    base-url: ${WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}

air-quality:
  api:
    key: ${AIR_QUALITY_API_KEY:}
    base-url: ${AIR_QUALITY_API_BASE_URL:https://apis.data.go.kr/B552584/ArpltnInforInqireSvc}

location:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

admin:
  api-key: ${ADMIN_API_KEY:}
  require-key: ${ADMIN_REQUIRE_KEY:false}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,application/json,text/plain
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: ${SERVER_MIN_THREADS:10}
    accept-count: ${SERVER_ACCEPT_COUNT:500}
    max-connections: ${SERVER_MAX_CONNECTIONS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.example.WebSideProject: DEBUG
