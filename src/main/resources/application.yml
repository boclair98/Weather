spring:
  config:
    import: optional:classpath:application-local.yml

  flyway:
    enabled: false

  datasource:
    url: ${DB_URL:jdbc:h2:mem:weather;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

weather:
  api:
    key: ${WEATHER_API_KEY:}
    base-url: ${WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}

air-quality:
  api:
    key: ${AIR_QUALITY_API_KEY:}
    base-url: ${AIR_QUALITY_API_BASE_URL:https://apis.data.go.kr/B552584/ArpltnInforInqireSvc}

weather-safety:
  warning:
    api-key: ${WEATHER_WARNING_API_KEY:}
    base-url: ${WEATHER_WARNING_API_BASE_URL:https://apis.data.go.kr/1360000/WthrWrnInfoService}
  uv:
    api-key: ${LIVING_WEATHER_API_KEY:}
    base-url: ${LIVING_WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/LivingWthrIdxServiceV5}
  pollen:
    api-key: ${POLLEN_API_KEY:}
    base-url: ${POLLEN_API_BASE_URL:https://apis.data.go.kr/1360000/HealthWthrIdxServiceV3}

location:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}

route:
  kakao-mobility:
    rest-api-key: ${KAKAO_MOBILITY_REST_API_KEY:}
    base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com/v1}
app:
  rate-limit:
    read-per-minute: ${RATE_LIMIT_READ_PER_MINUTE:180}
    write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:20}
    distributed: ${RATE_LIMIT_DISTRIBUTED:false}

admin:
  api-key: ${ADMIN_API_KEY:}
  require-key: ${ADMIN_REQUIRE_KEY:false}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,application/json,text/plain
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: ${SERVER_MIN_THREADS:10}
    accept-count: ${SERVER_ACCEPT_COUNT:500}
    max-connections: ${SERVER_MAX_CONNECTIONS:10000}

management:
  metrics:
    tags:
      application: weather
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200

info:
  app:
    name: Weather Decision Service
    api-schema: weather-briefing/1.0
    data-source: Korea Meteorological Administration

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-system}] [%thread] %logger{36} - %msg%n"
  level:
    com.example.WebSideProject: DEBUG
