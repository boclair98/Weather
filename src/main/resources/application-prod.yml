spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1500000
  thymeleaf:
    cache: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
      connect-timeout: 2s
app:
  rate-limit:
    distributed: true

admin:
  require-key: true

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,weatherApi
        liveness:
          include: livenessState

logging:
  level:
    root: INFO
    com.example.WebSideProject: INFO
