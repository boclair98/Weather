<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 구독</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        main {
            width: min(920px, 100%);
            margin: 0 auto;
            padding: 48px 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 32px;
            align-items: start;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 42px;
            line-height: 1.15;
            letter-spacing: 0;
        }

        .intro {
            margin: 0;
            color: #586276;
            font-size: 18px;
            line-height: 1.7;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #dfe5ef;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(30, 45, 75, 0.08);
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            border: 1px solid #c9d2e3;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
            background: #ffffff;
        }

        select {
            color: #172033;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .field {
            margin-bottom: 18px;
        }

        .split-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .time-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .time-option {
            display: grid;
            grid-template-columns: 18px 1fr;
            gap: 10px;
            align-items: start;
            padding: 12px;
            border: 1px solid #d6deec;
            border-radius: 6px;
            background: #ffffff;
        }

        .time-option strong {
            display: block;
            margin-bottom: 2px;
            color: #172033;
            font-size: 14px;
        }

        .time-option span {
            display: block;
            color: #66758d;
            font-size: 13px;
            line-height: 1.45;
        }

        .location-search {
            display: grid;
            grid-template-columns: 1fr 92px;
            gap: 10px;
        }

        .location-results {
            display: grid;
            gap: 8px;
            margin-top: 10px;
        }

        .location-option {
            width: 100%;
            height: auto;
            min-height: 44px;
            border: 1px solid #d6deec;
            border-radius: 6px;
            padding: 10px 12px;
            color: #1f3556;
            background: #ffffff;
            text-align: left;
            font-weight: 600;
        }

        .location-option.selected {
            border-color: #2563eb;
            background: #eef4ff;
        }

        button {
            height: 46px;
            border: 0;
            border-radius: 6px;
            padding: 0 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.68;
        }

        .secondary {
            color: #1f3556;
            background: #e9eef7;
            white-space: nowrap;
        }

        .primary {
            width: 100%;
            color: #ffffff;
            background: #2563eb;
        }

        .meta {
            min-height: 22px;
            margin: 8px 0 0;
            color: #66758d;
            font-size: 13px;
            line-height: 1.5;
        }

        .result {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .result.ok {
            display: block;
            color: #135d38;
            background: #e8f7ef;
            border: 1px solid #b7e2ca;
        }

        .result.error {
            display: block;
            color: #8a1f1f;
            background: #fdecec;
            border: 1px solid #f3b8b8;
        }

        @media (max-width: 820px) {
            main {
                padding: 32px 16px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }

            .location-search {
                grid-template-columns: 1fr;
            }

            .split-fields {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <div class="layout">
        <section>
            <h1>내 위치 날씨를 이메일로 받아보세요</h1>
            <p class="intro">이름과 이메일을 입력하고 지역을 검색하면 오늘 날씨 메일이 바로 발송됩니다. 이후에는 선택한 시간대에 같은 주소로 날씨 알림을 보내드립니다.</p>
        </section>

        <section class="panel" aria-label="날씨 구독 신청">
            <form id="subscribeForm">
                <div class="field">
                    <label for="name">이름</label>
                    <input id="name" name="name" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">이메일</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="split-fields">
                    <div class="field">
                        <label for="ageGroup">연령대</label>
                        <select id="ageGroup" name="ageGroup">
                            <option value="NONE">선택 안 함</option>
                            <option value="TEENS">10대</option>
                            <option value="TWENTIES">20대</option>
                            <option value="THIRTIES">30대</option>
                            <option value="FORTIES">40대</option>
                            <option value="FIFTIES_PLUS">50대 이상</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="gender">성별</label>
                        <select id="gender" name="gender">
                            <option value="NONE">선택 안 함</option>
                            <option value="FEMALE">여성</option>
                            <option value="MALE">남성</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="locationQuery">위치</label>
                    <div class="location-search">
                        <input id="locationQuery" name="locationQuery" placeholder="예: 대전 유성구, 강남역" required>
                        <button class="secondary" type="button" id="searchLocation">검색</button>
                    </div>
                    <div class="location-results" id="locationResults" aria-label="위치 검색 결과"></div>
                    <p class="meta" id="locationMeta">지역을 검색한 뒤 결과를 선택해주세요.</p>
                </div>

                <div class="field">
                    <label>알림 시간</label>
                    <div class="time-options">
                        <label class="time-option" for="morningEnabled">
                            <input id="morningEnabled" type="checkbox" checked>
                            <span>
                                <strong>아침 06:30</strong>
                                <span>출근·등교 전 09시 예보를 보내드립니다.</span>
                            </span>
                        </label>
                        <label class="time-option" for="afternoonEnabled">
                            <input id="afternoonEnabled" type="checkbox">
                            <span>
                                <strong>점심 11:30</strong>
                                <span>오후 외출 전 12시 예보를 보내드립니다.</span>
                            </span>
                        </label>
                        <label class="time-option" for="eveningEnabled">
                            <input id="eveningEnabled" type="checkbox">
                            <span>
                                <strong>저녁 18:30</strong>
                                <span>퇴근길과 저녁 일정 전 18시 예보를 보내드립니다.</span>
                            </span>
                        </label>
                    </div>
                    <p class="meta">선택하지 않으면 아침 알림으로 등록됩니다.</p>
                </div>

                <button class="primary" type="submit" id="submitButton">구독하기</button>
                <div class="result" id="result" role="status"></div>
            </form>
        </section>
    </div>
</main>

<script>
    const locationQuery = document.getElementById("locationQuery");
    const locationResults = document.getElementById("locationResults");
    const locationMeta = document.getElementById("locationMeta");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");
    const searchButton = document.getElementById("searchLocation");
    let selectedLocation = null;

    searchButton.addEventListener("click", searchLocations);
    locationQuery.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            searchLocations();
        }
    });

    document.getElementById("subscribeForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        result.className = "result";

        if (!selectedLocation) {
            showResult("날씨를 받을 위치를 먼저 선택해주세요.", false);
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "구독 처리 중";

        const payload = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            locationName: selectedLocation.locationName,
            latitude: selectedLocation.latitude,
            longitude: selectedLocation.longitude,
            nx: selectedLocation.nx,
            ny: selectedLocation.ny,
            ageGroup: document.getElementById("ageGroup").value,
            gender: document.getElementById("gender").value,
            morningEnabled: document.getElementById("morningEnabled").checked,
            afternoonEnabled: document.getElementById("afternoonEnabled").checked,
            eveningEnabled: document.getElementById("eveningEnabled").checked
        };

        try {
            const response = await fetch("/api/users/subscribe", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.message || "구독 처리에 실패했습니다.");
            }

            showResult(`${data.message} 메일함을 확인해주세요.`, true);
        } catch (error) {
            showResult(error.message, false);
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "구독하기";
        }
    });

    async function searchLocations() {
        const query = locationQuery.value.trim();
        if (!query) {
            showResult("검색할 지역명을 입력해주세요.", false);
            return;
        }

        selectedLocation = null;
        locationResults.innerHTML = "";
        locationMeta.textContent = "위치를 검색하는 중입니다.";
        searchButton.disabled = true;
        searchButton.textContent = "검색 중";

        try {
            const response = await fetch(`/api/locations/search?query=${encodeURIComponent(query)}`);
            const locations = await response.json().catch(() => []);
            if (!response.ok) {
                throw new Error(locations.message || "위치 검색에 실패했습니다.");
            }
            if (locations.length === 0) {
                locationMeta.textContent = "검색 결과가 없습니다. 더 구체적인 지역명을 입력해주세요.";
                return;
            }

            renderLocationResults(locations);
            selectLocation(locations[0], 0);
        } catch (error) {
            locationMeta.textContent = "지역을 검색한 뒤 결과를 선택해주세요.";
            showResult(error.message, false);
        } finally {
            searchButton.disabled = false;
            searchButton.textContent = "검색";
        }
    }

    function renderLocationResults(locations) {
        locationResults.innerHTML = "";
        locations.forEach((location, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "location-option";
            button.textContent = `${location.locationName} (격자 ${location.nx}, ${location.ny})`;
            button.addEventListener("click", () => selectLocation(location, index));
            locationResults.appendChild(button);
        });
    }

    function selectLocation(location, index) {
        selectedLocation = location;
        [...locationResults.children].forEach((element, elementIndex) => {
            element.classList.toggle("selected", elementIndex === index);
        });
        locationMeta.textContent = `선택 위치: ${location.locationName} (격자 ${location.nx}, ${location.ny})`;
    }

    function showResult(message, ok) {
        result.textContent = message;
        result.className = ok ? "result ok" : "result error";
    }
</script>
</body>
</html>
