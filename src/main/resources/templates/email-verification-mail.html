<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨한편 이메일 인증</title>
</head>
<body style="margin:0;background:#f4f7fb;color:#172033;font-family:Arial,'Noto Sans KR',sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
    <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e5eaf2;border-radius:24px;overflow:hidden;">
            <tr><td style="padding:28px 32px;background:linear-gradient(135deg,#2563eb,#6d8eff);color:#ffffff;">
                <div style="font-size:13px;letter-spacing:.08em;opacity:.86;">WEATHER HANPYEON</div>
                <h1 style="margin:10px 0 0;font-size:28px;line-height:1.25;">이메일 주소를 확인해주세요</h1>
            </td></tr>
            <tr><td style="padding:32px;">
                <p style="margin:0 0 12px;font-size:16px;line-height:1.7;">로그인 계정에 날씨 알림을 연결하려면 아래 버튼을 눌러 이메일 소유권을 확인해야 합니다.</p>
                <p style="margin:0 0 24px;color:#66758d;font-size:14px;line-height:1.6;">인증 대상: <strong th:text="${email}">you@example.com</strong><br>링크는 15분 동안만 유효합니다.</p>
                <a th:href="${verificationUrl}" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#2563eb;color:#ffffff;font-weight:700;text-decoration:none;">이메일 인증하고 계속하기</a>
                <p style="margin:26px 0 0;color:#8b97aa;font-size:12px;line-height:1.6;">본인이 요청하지 않았다면 이 메일을 무시해주세요. 인증을 완료하지 않으면 구독이 생성되지 않습니다.</p>
            </td></tr>
            <tr><td style="padding:18px 32px;background:#f8fafc;color:#8b97aa;font-size:12px;">날씨한편 · 로그인 계정 전용 날씨 브리핑</td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
