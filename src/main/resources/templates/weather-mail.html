<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f5f7fa; margin: 0; padding: 20px; }
        .container { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 32px 28px; text-align: center; }
        .header h1 { margin: 0 0 6px; font-size: 24px; }
        .header p  { margin: 0; opacity: 0.85; font-size: 14px; }
        .body { padding: 28px; }
        .greeting { font-size: 16px; color: #333; margin-bottom: 20px; }
        .weather-card { background: #f0f4ff; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .weather-main { font-size: 36px; text-align: center; margin-bottom: 8px; }
        .weather-desc { text-align: center; color: #555; font-size: 15px; margin-bottom: 16px; }
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .weather-item { background: white; border-radius: 8px; padding: 12px; text-align: center; }
        .weather-item .label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .weather-item .value { font-size: 18px; font-weight: 600; color: #333; }
        .footer { background: #f9f9f9; padding: 18px 28px; text-align: center; font-size: 12px; color: #aaa; border-top: 1px solid #eee; }
        .unsubscribe { color: #bbb; text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>아침 날씨 🌤️</h1>
        <p th:text="|${locationName} · ${weather.forecastLabel}|">서울특별시 중구 · 5월 4일 아침 예보</p>
    </div>
    <div class="body">
        <p class="greeting" th:text="|안녕하세요, ${name}님! 아침 외출 전에 날씨를 확인해보세요 😊|"></p>
        <div class="weather-card">
            <div class="weather-main"  th:text="${weather.skyDescription}">맑음 ☀️</div>
            <div class="weather-desc"  th:text="'강수: ' + ${weather.ptyDescription} + ' / 강수확률: ' + ${weather.pop} + '%'"></div>
            <div class="weather-grid">
                <div class="weather-item">
                    <div class="label">아침 예상 기온</div>
                    <div class="value" th:text="${weather.tmp} + '°C'">18°C</div>
                </div>
                <div class="weather-item">
                    <div class="label">최고 / 최저</div>
                    <div class="value" th:text="${weather.tmx} + '° / ' + ${weather.tmn} + '°'">24° / 13°</div>
                </div>
                <div class="weather-item">
                    <div class="label">습도</div>
                    <div class="value" th:text="${weather.reh} + '%'">55%</div>
                </div>
                <div class="weather-item">
                    <div class="label">풍속</div>
                    <div class="value" th:text="${weather.wsd} + 'm/s'">2.5m/s</div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        날씨 데이터 제공: 기상청<br>
        <a class="unsubscribe" th:href="${unsubscribeUrl}">수신 거부</a>
    </div>
</div>
</body>
</html>
