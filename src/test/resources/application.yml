spring:
  datasource:
    url: jdbc:h2:mem:weather;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,USERS
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  task:
    scheduling:
      enabled: false
  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password

coders:
  identity:
    required: false

admin:
  require-key: false

weather:
  api:
    key: test-weather-key
    base-url: https://example.test/weather
air-quality:
  api:
    key: test-air-key
    base-url: https://example.test/air
location:
  kakao:
    rest-api-key: test-kakao-key
app:
  base-url: http://localhost:8080
