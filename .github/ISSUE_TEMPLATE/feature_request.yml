name: Feature request
description: 사용자 문제에서 출발한 개선안을 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: user-problem
    attributes:
      label: 사용자 문제
      description: 기능 이름보다 사용자가 지금 해결하지 못하는 일을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 결과
      description: 사용자가 무엇을 더 빠르고 안전하게 결정할 수 있어야 하나요?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 필요한 데이터와 실패 시 동작
      description: 추가 API, 개인정보, fallback이 필요하다면 적어주세요.
  - type: textarea
    id: measure
    attributes:
      label: 성공 측정 방법
      description: 클릭 수가 아니라 사용자 결과를 검증할 지표를 제안해주세요.
