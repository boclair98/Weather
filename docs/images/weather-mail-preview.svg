<svg width="920" height="620" viewBox="0 0 920 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="920" height="620" rx="24" fill="#F5F7FA"/>
  <rect x="230" y="40" width="460" height="540" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="230" y="40" width="460" height="118" rx="18" fill="url(#header)"/>
  <text x="384" y="88" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">아침 날씨</text>
