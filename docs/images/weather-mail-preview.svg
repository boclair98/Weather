  <text x="397" y="278" fill="#333333" font-family="Arial, sans-serif" font-size="34" font-weight="700">맑음</text>
  <text x="364" y="310" fill="#555555" font-family="Arial, sans-serif" font-size="14">강수: 없음 / 강수확률: 10%</text>

  <rect x="286" y="330" width="164" height="48" rx="8" fill="#FFFFFF"/>
  <text x="336" y="350" fill="#888888" font-family="Arial, sans-serif" font-size="11">예상 기온</text>
  <text x="344" y="370" fill="#333333" font-family="Arial, sans-serif" font-size="17" font-weight="700">22°C</text>
  <rect x="470" y="330" width="164" height="48" rx="8" fill="#FFFFFF"/>
  <text x="524" y="350" fill="#888888" font-family="Arial, sans-serif" font-size="11">습도</text>
  <text x="531" y="370" fill="#333333" font-family="Arial, sans-serif" font-size="17" font-weight="700">55%</text>

  <rect x="266" y="418" width="388" height="118" rx="12" fill="#FFF8E7" stroke="#FFE2A7"/>
  <text x="292" y="450" fill="#7A4D00" font-family="Arial, sans-serif" font-size="15" font-weight="700">오늘의 맞춤 추천</text>
